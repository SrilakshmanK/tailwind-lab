<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Flex</title>
  </head>
  <body>
    <!-- https://tailwindcss.com/docs/flex -->
    <h1 class="m-5 text-2xl">Flex-row</h1>
    <div class="border m-10">
      <ul class="flex">
        <li class="bg-teal-300 m-5 p-5">01</li>
        <li class="bg-teal-300 m-5 p-5">02</li>
        <li class="bg-teal-300 m-5 p-5">03</li>
        <li class="bg-teal-300 m-5 p-5">04</li>
        <li class="bg-teal-300 m-5 p-5">05</li>
      </ul>
    </div>

    <!-- https://tailwindcss.com/docs/flex-direction#column -->
    <h1 class="m-5 text-2xl">Flex-col</h1>
    <div class="border m-10">
      <ul class="flex flex-col max-w-[500px]">
        <li class="bg-teal-300 m-5 p-5">01</li>
        <li class="bg-teal-300 m-5 p-5">02</li>
        <li class="bg-teal-300 m-5 p-5">03</li>
        <li class="bg-teal-300 m-5 p-5">04</li>
        <li class="bg-teal-300 m-5 p-5">05</li>
      </ul>
    </div>

    <!-- https://tailwindcss.com/docs/justify-items -->
    <h1 class="m-5 text-2xl">Flex-justify</h1>
    <div class="border m-10">
      <ul class="flex justify-around">
        <li class="bg-teal-300 m-5 p-5">01</li>
        <li class="bg-teal-300 m-5 p-5">02</li>
        <li class="bg-teal-300 m-5 p-5">03</li>
        <li class="bg-teal-300 m-5 p-5">04</li>
        <li class="bg-teal-300 m-5 p-5">05</li>
      </ul>
    </div>

    <!-- https://tailwindcss.com/docs/order -->
    <h1 class="m-5 text-2xl">Flex-order</h1>
    <div class="border m-10">
      <ul class="flex">
        <li class="bg-teal-300 m-5 p-5 order-5">01</li>
        <li class="bg-teal-300 m-5 p-5 order-4">02</li>
        <li class="bg-teal-300 m-5 p-5 order-3">03</li>
        <li class="bg-teal-300 m-5 p-5 order-2">04</li>
        <li class="bg-teal-300 m-5 p-5 order-1">05</li>
      </ul>
    </div>

    <!-- Grow and shrink -->
    <!-- https://tailwindcss.com/docs/flex-shrink -->
    <h1 class="m-5 text-2xl">flex-shrink/h1>
    <div class="border m-10">
      <ul class="flex w-100">
        <li class="p-5 m-3 bg-teal-300 flex-none">01</li>
        <li class="p-5 m-3 bg-teal-300 flex-initial">02</li>
        <li class="p-5 m-3 bg-teal-300 flex-auto">03</li>
        <li class="p-5 m-3 bg-teal-300 flex-1">04</li>
        <li class="p-5 m-3 bg-teal-300 ">05</li>
        <li class="p-5 m-3 bg-teal-300 ">06</li>
        <li class="p-5 m-3 bg-teal-300 ">07</li>
      </ul>
    </div>
  </body>
</html>
